# How to run:
#   docker-compose up -d && docker-compose logs -f pull-llm
# Check models
#   docker-compose exec ollama ollama list
# Check connectivity from remote host on *SAME LAN*
#   curl http://<hostname>.local:11434/api/tags

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports: ["11434:11434"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ./data:/root/.ollama
    healthcheck:
      # returns 0 once the server is accepting commands
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  pull-llm:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # IMPORTANT: correct port (11434) and talk to the service name
      - OLLAMA_HOST=ollama:11434
    volumes:
      - ./data:/root/.ollama
    # qwen2.5:1.5b-instruct fits 4GB GPUs reasonably
    entrypoint: ["/bin/sh","-lc","ollama pull qwen2.5:1.5b-instruct || true"]
    restart: "no"
