http:
  routers:
    qdrant:
      # Qdrant route — note the difference from Ollama
      #
      # Environment variable:
      #   {{ env "QDRANT_API_KEY" }}
      #
      # Route:
      #   https://<traefik_proxy_address>:<shared_traefik_ssl_port>/qdrant
      #
      # HTTP header format expected (handled internally by Qdrant itself):
      #   • Header name: api-key
      #   • Header value: <QDRANT_API_KEY>
      #
      # Notes:
      #   • Qdrant implements its own API-key authentication natively.
      #   • Traefik here only handles routing, TLS termination, and prefix strip;
      #     it does *not* authenticate on behalf of Qdrant.
      rule: Host(`{{ env "SERVER_FQDN" }}`) && PathPrefix(`/qdrant`)
      entryPoints: [websecure]
      tls: {} # use your existing cert from tls.yaml
      middlewares: [qdrant-strip]
      service: qdrant
  middlewares:
    qdrant-strip:
      stripPrefix:
        prefixes: ["/qdrant"]
  services:
    qdrant:
      loadBalancer:
        servers:
          - url: http://qdrant:6333 # resolves via Docker DNS since Traefik is on qdrant_isolated
